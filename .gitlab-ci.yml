# ==================================================================================================================================
# Continuous Integration/Continuous Deployment
# ==================================================================================================================================

spec:
  inputs:
    DO_DEPLOY:
      type: boolean
      description: "Push the master branch to the reggie-framework/reggie repository on github"
      default: false
---
# NOTE: The runner uses the shell executor, so `image:` would be ignored. Jobs run on the host.

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Templates ("hidden jobs")
# ----------------------------------------------------------------------------------------------------------------------------------------------------
.defaults: &defaults
  # tags: [dockertag]
  # cache:
  #   - *venv_cache
  #   - *pip_cache
  # CI/CD has no dependencies
  dependencies: []

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Define a reusable global before_script with YAML anchors
.global-before-script: &global-before-script
  # Load modules on new boltzplatz reggie
  - export PATH="/var/lib/gitlab-runner/.local/bin:$PATH"
  - module list || true
  # Setup system
  - ulimit -s unlimited
  - python3 -V || true
  # Setup Python virtual environment
  - python3 -m venv .venv
  - source .venv/bin/activate
  # Linter versions come from .pre-commit-config.yaml (single source of truth).
  # precommit_rev <repo-url> prints that repo's rev without a leading "v" and fails if the repo is missing.
  - python -m pip install -q pyyaml
  - |
    precommit_rev() { python -c 'import sys, yaml; cfg = yaml.safe_load(open(".pre-commit-config.yaml")); print(next(r["rev"] for r in cfg["repos"] if r["repo"] == sys.argv[1]).removeprefix("v"))' "$1"; }
  # Install reggie
  - python -m pip install --editable .

# Define a reusable global before_script with YAML anchors
.minimal-before-script: &minimal-before-script
  # Load modules on new boltzplatz reggie
  - export PATH="/var/lib/gitlab-runner/.local/bin:$PATH"
  - module list || true
  # Setup system
  - ulimit -s unlimited
  - python3 -V || true
  # Setup Python virtual environment
  - python3 -m venv .venv
  - source .venv/bin/activate
  # Linter versions come from .pre-commit-config.yaml (single source of truth).
  # precommit_rev <repo-url> prints that repo's rev without a leading "v" and fails if the repo is missing.
  - python -m pip install -q pyyaml
  - |
    precommit_rev() { python -c 'import sys, yaml; cfg = yaml.safe_load(open(".pre-commit-config.yaml")); print(next(r["rev"] for r in cfg["repos"] if r["repo"] == sys.argv[1]).removeprefix("v"))' "$1"; }

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stages
# ----------------------------------------------------------------------------------------------------------------------------------------------------
stages:
  - lint
  - compatibility
  - deploy

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Linter
# ----------------------------------------------------------------------------------------------------------------------------------------------------
ruff:
  extends: .defaults
  stage: lint
  before_script: *minimal-before-script
  script:
    # Install Ruff
    - RUFF_VERSION=$(precommit_rev https://github.com/astral-sh/ruff-pre-commit)
    - python -m pip install "ruff==${RUFF_VERSION}"
    # Ruff linter
    - ruff --version
    - ruff check --config pyproject.toml --preview reggie

ty:
  extends: .defaults
  stage: lint
  before_script: *global-before-script
  script:
    # Install Ty
    - TY_VERSION=$(precommit_rev https://github.com/astral-sh/ty-pre-commit)
    - python -m pip install "ty==${TY_VERSION}"
    # Ty type checker
    - ty --version
    - ty check --color always --project reggie

vulture:
  extends: .defaults
  stage: lint
  before_script: *minimal-before-script
  script:
    - VULTURE_VERSION=$(precommit_rev https://github.com/jendrikseipp/vulture)
    - python -m pip install "vulture==${VULTURE_VERSION}"
    - vulture --version
    - vulture --config pyproject.toml reggie

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Compatibility
# ----------------------------------------------------------------------------------------------------------------------------------------------------

.compatibility-script: &compatibility-script
  script:
    # Compatibility
    - reggie --help

compatibility:
  extends: .defaults
  stage: compatibility
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key: "uv-$PYTHON_VERSION"
    paths:
      - .uv-cache
  before_script:
    - ulimit -s unlimited
    # Bootstrap uv in its own venv (host Python is externally managed, PEP 668)
    - python3 -m venv .uv
    - .uv/bin/pip install -q uv
    # Create and activate the venv for the requested Python version (uv downloads it if missing)
    - .uv/bin/uv venv --python "$PYTHON_VERSION" ".venv-$PYTHON_VERSION"
    - source ".venv-$PYTHON_VERSION/bin/activate"
    - python --version
    # Install reggie
    - .uv/bin/uv pip install -e .
  <<: *compatibility-script
  after_script:
    - .uv/bin/uv cache prune --ci || true
  rules:
    - if: '$PYTHON_VERSION == "3.15"'
      allow_failure: true
    - when: on_success

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Stage "github": Push the master branch to github
# ----------------------------------------------------------------------------------------------------------------------------------------------------
github:
  stage: deploy
  script:
    - if [ "$[[ inputs.DO_DEPLOY ]]" == "false" ]; then exit ; fi
    - rm -rf reggie_github || true ;
    - git clone -b master --single-branch git@piclas.boltzplatz.eu:reggie2.0/reggie2.0.git reggie_github ;
    - cd reggie_github ;
    - git remote add reggie-framework git@github.com-framework-reggie2.0:reggie-framework/reggie.git ;
    - git push --force --follow-tags reggie-framework master ;
  rules:
    - if: $[[ inputs.DO_DEPLOY ]] == true
